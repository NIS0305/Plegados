<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Almacén — Plegados</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <button class="theme-toggle-float">☀️</button>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <img src="logo.png" alt="Lumon" style="height:64px;width:auto;filter:brightness(0) invert(1);margin-bottom:12px" />
      <p>Acceso exclusivo — Almacén</p>
    </div>

    <div class="auth-card">
      <!-- Sin pestaña de registro: el alta de cuentas de almacén se hace en la
           base de datos. El autoservicio exigía un código de almacén que viajaba
           en claro en el JavaScript. Ver README.md. -->
      <!-- LOGIN -->
      <form id="loginForm" class="auth-form active" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="tu@email.com" required />
          <span class="error-msg" id="err-loginEmail"></span>
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="loginPassword" placeholder="••••••••" required />
            <button type="button" class="toggle-pass" data-target="loginPassword">👁</button>
          </div>
          <span class="error-msg" id="err-loginPassword"></span>
        </div>
        <div class="error-msg form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Entrar</button>
        <p class="auth-hint">Las cuentas de almacén las da de alta el administrador.</p>
      </form>

    </div>
  </div>

  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    getSessionUser().then(u => { if (u) window.location.href = u.role === 'admin' ? 'dashboard.html' : 'index.html'; });

    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.target);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.textContent = inp.type === 'password' ? '👁' : '🙈';
      });
    });

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      const btn   = document.getElementById('loginBtn');

      document.getElementById('err-loginEmail').textContent    = '';
      document.getElementById('err-loginPassword').textContent = '';
      errEl.textContent = '';

      if (!email) { document.getElementById('err-loginEmail').textContent = 'Ingresa tu email'; return; }
      if (!pass)  { document.getElementById('err-loginPassword').textContent = 'Ingresa tu contraseña'; return; }

      btn.disabled = true; btn.textContent = 'Verificando...';
      try {
        const user = await loginUser(email, pass);
        if (user.role !== 'almacen') {
          await _db.auth.signOut();
          errEl.textContent = 'Esta página es exclusiva para usuarios de almacén.';
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    ['loginEmail','loginPassword'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('err-' + id).textContent = '';
        document.getElementById('loginError').textContent = '';
      });
    });
  </script>
</body>
</html>
