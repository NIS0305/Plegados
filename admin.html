<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración — TMI Plegados</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>html{background:#111110}body{visibility:hidden}</style>
  <script>setTimeout(function(){try{document.body.style.visibility='visible'}catch(e){}},6000)</script>
</head>
<body class="auth-body">

  <!-- Panel de marca -->
  <div class="auth-left">
    <div class="lgrid-glow"></div>
    <img src="tmi-gecko.webp" alt="" class="auth-gecko" />
    <img src="tmi-wordmark.webp" alt="TMI" class="wordmark-img" />
    <div class="hero">
      <div class="eyebrow-row"><span class="eyebar"></span><span class="ey">Panel de administración</span></div>
      <h1 class="cond">Plegados<br><span>en control.</span></h1>
      <p>Acceso de administración: pedidos de montadores y de almacén, gráficas, usuarios y estados en vivo.</p>
    </div>
    <div class="claim ey">Diseño · Fabricación · Soluciones</div>
  </div>

  <!-- Formulario -->
  <div class="auth-right">
    <div class="auth-card">
      <div class="kh cond">Administración</div>
      <div class="ks">Acceso restringido a administradores.</div>

      <!-- LOGIN -->
      <form id="adminLoginForm" class="auth-form active" novalidate>
        <div class="form-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" placeholder="tu@email.com" required autocomplete="username" />
          <span class="error-msg" id="err-adminEmail"></span>
        </div>
        <div class="form-group">
          <label for="adminPassword">Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pass" data-target="adminPassword">👁</button>
          </div>
          <span class="error-msg" id="err-adminPassword"></span>
        </div>
        <div class="error-msg form-error" id="adminError"></div>
        <button type="submit" class="btn btn-primary btn-full" id="adminLoginBtn">Entrar</button>
      </form>

      <div class="auth-foot ey">© 2026 TMI — Tenkai Global, S.L.</div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    getSessionUser().then(u => { if (u && ['admin','almacen'].includes(u.role)) { window.location.href = 'dashboard.html'; } else { document.body.style.visibility = 'visible'; } }).catch(() => { document.body.style.visibility = 'visible'; });

    // Toggle password visibility
    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', function () {
        const inp = document.getElementById(this.dataset.target);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        this.textContent = inp.type === 'password' ? '👁' : '🙈';
      });
    });

    // LOGIN
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass  = document.getElementById('adminPassword').value;
      const errEl = document.getElementById('adminError');
      const btn   = document.getElementById('adminLoginBtn');

      document.getElementById('err-adminEmail').textContent    = '';
      document.getElementById('err-adminPassword').textContent = '';
      errEl.textContent = '';

      if (!email) { document.getElementById('err-adminEmail').textContent = 'Ingresa tu email'; return; }
      if (!pass)  { document.getElementById('err-adminPassword').textContent = 'Ingresa tu contraseña'; return; }

      btn.disabled = true; btn.textContent = 'Verificando...';
      try {
        const user = await loginUser(email, pass);
        if (user.role !== 'admin') {
          await _db.auth.signOut();
          errEl.textContent = 'Acceso restringido a administradores.';
          btn.disabled = false; btn.textContent = 'Entrar';
          return;
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    // Clear errors on input
    ['adminEmail','adminPassword'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('err-' + id).textContent = '';
        document.getElementById('adminError').textContent = '';
      });
    });
  </script>
</body>
</html>
