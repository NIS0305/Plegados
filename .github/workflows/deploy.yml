name: Deploy to VPS via Coolify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify webhook
        run: |
          curl --silent --show-error --fail \
            -X GET "https://coolify.tmisystem.com/api/v1/deploy?uuid=zx1tjgivvnwskrfzrm4kz3tf&force=false"
