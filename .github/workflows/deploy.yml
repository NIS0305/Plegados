name: Deploy to VPS via Coolify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify webhook
        run: |
          curl --silent --show-error --fail \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
